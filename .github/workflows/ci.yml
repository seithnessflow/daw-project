name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  EXPECTED_HASH: f40af882097b704a

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler libprotobuf-dev xxhash

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Clone and build automerge-c
        run: |
          # Install nightly with rust-src (required by automerge-c)
          rustup toolchain install nightly
          rustup component add rust-src --toolchain nightly

          # Clone automerge monorepo to expected location
          mkdir -p build/_deps
          git clone --depth 1 --branch main https://github.com/automerge/automerge.git build/_deps/automerge-src

          # Build automerge-c
          cd build/_deps/automerge-src/rust/automerge-c
          cmake -B build -DBUILD_TESTING=OFF
          cmake --build build -j$(nproc)

      - name: Build engine
        run: |
          cd engine
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Run engine tests
        run: |
          cd engine
          ./build/daw_engine_test

      - name: Generate test fixture
        run: |
          cd engine
          # Short fixture (10s) with the tone asset exposed under the hash
          # name the engine resolves (<assetHash>.wav)
          ASSET_HASH=$(./build/create_test_doc test-assets/test.am test-assets 10 \
            | grep 'Asset hash' | awk '{print $3}')
          cp test-assets/test_tone.wav "test-assets/${ASSET_HASH}.wav"
          echo "Asset exposed as ${ASSET_HASH}.wav"

      - name: Verify render determinism
        # Cross-run determinism of a REAL (non-silent) render. The reference
        # hash ($EXPECTED_HASH) is asserted by daw_engine_test above: a
        # rendering regression fails the "Run engine tests" step.
        run: |
          cd engine
          ./build/daw_engine --doc test-assets/test.am --render /tmp/render1.wav --assets test-assets
          ./build/daw_engine --doc test-assets/test.am --render /tmp/render2.wav --assets test-assets

          HASH1=$(xxhsum /tmp/render1.wav | cut -d' ' -f1)
          HASH2=$(xxhsum /tmp/render2.wav | cut -d' ' -f1)

          echo "Render 1 hash: $HASH1"
          echo "Render 2 hash: $HASH2"

          if [ "$HASH1" != "$HASH2" ]; then
            echo "ERROR: Non-deterministic render!"
            exit 1
          fi

          echo "Determinism verified: $HASH1"

      - name: Build server
        run: |
          cd server
          cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web
        run: |
          cd web
          npm ci
          npm run build

  test-e2e:
    runs-on: ubuntu-latest
    needs: [] # Independent of build-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler libprotobuf-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Clone and build automerge-c
        run: |
          rustup toolchain install nightly
          rustup component add rust-src --toolchain nightly

          mkdir -p build/_deps
          git clone --depth 1 --branch main https://github.com/automerge/automerge.git build/_deps/automerge-src

          cd build/_deps/automerge-src/rust/automerge-c
          cmake -B build -DBUILD_TESTING=OFF
          cmake --build build -j$(nproc)

      - name: Build engine
        # The fader-to-engine E2E tests spawn the engine and its fixture
        # generator (engine/build/daw_engine, engine/build/create_test_doc)
        run: |
          cd engine
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Build server
        run: |
          cd server
          cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: |
          cd web
          npm ci

      - name: Install Playwright (Chromium only)
        run: |
          cd web
          npx playwright install chromium --with-deps

      - name: Start server
        run: |
          cd server
          ./target/release/daw-server &
          sleep 2

      - name: Run E2E tests
        run: |
          cd web
          npm run dev &
          sleep 3
          npm run test:e2e

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7
