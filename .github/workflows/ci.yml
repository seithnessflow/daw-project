name: CI

on:
  push:
    branches: [master, main]
    # Docs-only pushes build nothing. KNOWN TRAP, recorded upfront: the day
    # this repo gets protected branches with required checks, a markdown-only
    # push produces NO run at all and a missing required check blocks the
    # merge - this line must evolve at that moment.
    paths-ignore: ['**.md']
  pull_request:
    branches: [master, main]
    paths-ignore: ['**.md']

env:
  # Criterion 1 reference (asserted inside daw_engine_test; see DECISIONS.md)
  EXPECTED_HASH: 89f1a1105dc09e92

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler libprotobuf-dev xxhash \
            libx11-dev libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev \
            libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libcairo2-dev libfreetype6-dev libexpat1-dev \
            libgtkmm-3.0-dev libsqlite3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Clone and build automerge-c
        run: |
          # Install nightly with rust-src (required by automerge-c)
          rustup toolchain install nightly
          rustup component add rust-src --toolchain nightly

          # Clone automerge monorepo, pinned to the ADR-016 commit, into
          # third_party/ (outside any build tree)
          mkdir -p third_party/automerge
          cd third_party/automerge
          git init -q
          git remote add origin https://github.com/automerge/automerge.git
          git fetch --depth 1 origin 47908d6c04a0ce3fea0fa1d6b7f5ce6ba3e5792e
          git checkout -q FETCH_HEAD
          cd ../..

          # Build automerge-c
          cd third_party/automerge/rust/automerge-c
          cmake -B build -DBUILD_TESTING=OFF
          cmake --build build -j$(nproc)

      - name: Cache VST3 SDK build tree
        # Sources AND objects in ONE archive: tar preserves mtimes, so ninja
        # sees the cached SDK objects (engine/build/vst3sdk) newer than the
        # cached SDK sources and skips them, while engine sources arrive from
        # checkout with fresh mtimes and rebuild as usual. .ninja_log and
        # .ninja_deps live at the build-tree root, hence engine/build whole.
        # The SDK is pinned, so this cache lives until the pin or the CMake
        # config that shapes it changes.
        uses: actions/cache@v4
        with:
          path: |
            third_party/vst3sdk
            engine/build
          key: vst3-buildtree-${{ runner.os }}-v3.8.1_build_84-${{ hashFiles('engine/CMakeLists.txt') }}

      - name: Clone VST3 SDK (pinned, see docs/cadrage-2.4.md)
        run: |
          if [ ! -d third_party/vst3sdk ]; then
            git clone --recursive --depth 1 --branch v3.8.1_build_84 \
              https://github.com/steinbergmedia/vst3sdk.git third_party/vst3sdk
          else
            echo "VST3 SDK restored from cache - clone skipped"
          fi

      - name: Build engine
        run: |
          cd engine
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Run engine tests
        run: |
          cd engine
          ./build/daw_engine_test

      - name: Generate test fixture
        run: |
          cd engine
          # Short fixture (10s) with the tone asset exposed under the hash
          # name the engine resolves (<assetHash>.wav)
          ASSET_HASH=$(./build/create_test_doc test-assets/test.am test-assets 10 \
            | grep 'Asset hash' | awk '{print $3}')
          cp test-assets/test_tone.wav "test-assets/${ASSET_HASH}.wav"
          echo "Asset exposed as ${ASSET_HASH}.wav"

      - name: Verify render determinism
        # Cross-run determinism of a REAL (non-silent) render. The reference
        # hash ($EXPECTED_HASH) is asserted by daw_engine_test above: a
        # rendering regression fails the "Run engine tests" step.
        run: |
          cd engine
          ./build/daw_engine --doc test-assets/test.am --render /tmp/render1.wav --assets test-assets
          ./build/daw_engine --doc test-assets/test.am --render /tmp/render2.wav --assets test-assets

          HASH1=$(xxhsum /tmp/render1.wav | cut -d' ' -f1)
          HASH2=$(xxhsum /tmp/render2.wav | cut -d' ' -f1)

          echo "Render 1 hash: $HASH1"
          echo "Render 2 hash: $HASH2"

          if [ "$HASH1" != "$HASH2" ]; then
            echo "ERROR: Non-deterministic render!"
            exit 1
          fi

          echo "Determinism verified: $HASH1"

      - name: Build server
        run: |
          cd server
          cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web
        run: |
          cd web
          npm ci
          npm run build

  test-e2e:
    runs-on: ubuntu-latest
    needs: [] # Independent of build-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler libprotobuf-dev \
            libx11-dev libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev \
            libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libcairo2-dev libfreetype6-dev libexpat1-dev \
            libgtkmm-3.0-dev libsqlite3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Clone and build automerge-c
        run: |
          rustup toolchain install nightly
          rustup component add rust-src --toolchain nightly

          mkdir -p third_party/automerge
          cd third_party/automerge
          git init -q
          git remote add origin https://github.com/automerge/automerge.git
          git fetch --depth 1 origin 47908d6c04a0ce3fea0fa1d6b7f5ce6ba3e5792e
          git checkout -q FETCH_HEAD
          cd ../..

          cd third_party/automerge/rust/automerge-c
          cmake -B build -DBUILD_TESTING=OFF
          cmake --build build -j$(nproc)

      - name: Cache VST3 SDK build tree
        # Sources AND objects in ONE archive: tar preserves mtimes, so ninja
        # sees the cached SDK objects (engine/build/vst3sdk) newer than the
        # cached SDK sources and skips them, while engine sources arrive from
        # checkout with fresh mtimes and rebuild as usual. .ninja_log and
        # .ninja_deps live at the build-tree root, hence engine/build whole.
        # The SDK is pinned, so this cache lives until the pin or the CMake
        # config that shapes it changes.
        uses: actions/cache@v4
        with:
          path: |
            third_party/vst3sdk
            engine/build
          key: vst3-buildtree-${{ runner.os }}-v3.8.1_build_84-${{ hashFiles('engine/CMakeLists.txt') }}

      - name: Clone VST3 SDK (pinned, see docs/cadrage-2.4.md)
        run: |
          if [ ! -d third_party/vst3sdk ]; then
            git clone --recursive --depth 1 --branch v3.8.1_build_84 \
              https://github.com/steinbergmedia/vst3sdk.git third_party/vst3sdk
          else
            echo "VST3 SDK restored from cache - clone skipped"
          fi

      - name: Build engine
        # The fader-to-engine E2E tests spawn the engine and its fixture
        # generator (engine/build/daw_engine, engine/build/create_test_doc)
        run: |
          cd engine
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Build server
        run: |
          cd server
          cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: |
          cd web
          npm ci

      - name: Install Playwright (Chromium only)
        run: |
          cd web
          npx playwright install chromium --with-deps

      - name: Start server
        run: |
          cd server
          ./target/release/daw-server &
          sleep 2

      - name: Run E2E tests
        run: |
          cd web
          npm run dev &
          sleep 3
          npm run test:e2e

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7
