[package]
name = "daw-server"
version = "0.1.0"
edition = "2021"
description = "DAW sync server with Automerge CRDT"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# WebSocket
tokio-tungstenite = "0.21"
futures = "0.3"

# Automerge - pinned to match engine monorepo (commit 47908d6c)
automerge = "=0.11.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
