syntax = "proto3";

package daw.protocol;

// =============================================================================
// Client -> Engine Messages
// =============================================================================

// Transport control
message TransportCommand {
    enum Action {
        PLAY = 0;
        STOP = 1;
        SEEK = 2;
        LOOP = 3;  // V1.1: toggle looping (performance state, never CRDT)
    }
    Action action = 1;
    int64 seek_position = 2;  // Only used when action == SEEK (in samples)
    bool loop_enabled = 3;    // Only used when action == LOOP
    // BOUCLE UTILISATEUR (AUDIT-6 QW, 2026-08-27) - action == LOOP :
    // set_region pose la region [loop_start, loop_end) en samples (le
    // wrap se fait sur elle) ; clear_region revient aux braces AUTO
    // [0, fin du contenu]. Sans l'un ni l'autre : simple toggle (la
    // region en place est conservee). Etat de PERFORMANCE, jamais CRDT.
    bool set_region = 4;
    int64 loop_start = 5;
    int64 loop_end = 6;
    bool clear_region = 7;
}

// Monitor control (solo/mute per track - local to this client)
message SetMonitor {
    string track_id = 1;
    bool solo = 2;
    bool mute = 3;
}

// S8a: subscribe/unsubscribe this client to the master tap (the jam
// road: engine -> LOCAL tab over loopback; the tab ships it P2P)
message TapControl {
    bool enabled = 1;
}

// =============================================================================
// Engine -> Client Messages
// =============================================================================

// Transport position (sent at 30 Hz)
// Client -> Engine: open/close a plugin's native GUI window on demand.
// Per-node toggle (the --editors flag only opened them ALL at spawn).
message EditorControl {
    string node_id = 1;   // the chain node whose plugin window to toggle
    bool open = 2;        // true = show the GUI, false = close it
}

// F5 : Client -> Engine. Lancer / arreter un slot du clip-launcher (Session).
// Les slots jouent en boucle sur l'horloge de session (independants du
// transport d'arrangement). track_id vide = tous les pistes de la scene.
// F5+ semantique du STOP : scene_id vide = arreter QUEL QUE SOIT le slot
// (track_id vide en plus = STOP ALL) ; scene_id donne = n'arreter que les
// slots DE CETTE SCENE (avant F5+, stop arretait tout - defaut corrige).
message SessionLaunch {
    string scene_id = 1;   // la scene (ligne) du slot a lancer
    string track_id = 2;   // la piste (colonne) ; vide = toute la scene
    bool stop = 3;         // true = arreter (le slot de track_id, ou toute la scene)
    // F5+ : lancer au prochain QUANTUM au lieu d'immediatement. Le quantum =
    // loop_len du 1er slot lance (l'ancre, qui part immediatement et pose
    // l'epoque). Ignore quand rien ne joue (le lancement est l'ancre).
    bool quantize = 4;
}

// F5+ : Engine -> Client, avec la telemetrie. La VERITE des slots (l'UI
// n'affiche plus un etat local optimiste) : un slot absent est arrete ;
// queued = lance mais en attente de son quantum.
message SessionState {
    message Slot {
        string track_id = 1;
        string scene_id = 2;
        bool queued = 3;   // true = en file (quantize), false = joue
    }
    repeated Slot slots = 1;
}

message TransportPosition {
    int64 position_samples = 1;
    bool is_playing = 2;
    // AUDIT-5 A8: the engine's real device sample rate, so the web stops
    // hardcoding 48000 (the playhead drifts 8.8% on a 44.1k device).
    // Additive: 0 (absent, old engine) -> the web keeps its 48000 fallback.
    uint32 sample_rate = 3;
}

// Per-track meter levels
message TrackMeter {
    string track_id = 1;
    float peak_left = 2;
    float peak_right = 3;
}

// All meters (sent at 30 Hz)
message Meters {
    repeated TrackMeter tracks = 1;
    float master_peak_left = 2;   // V1.2: post-master-gain output peaks -
    float master_peak_right = 3;  // the browser had NO master path before
}

// Engine state (sent at 30 Hz with telemetry)
message EngineState {
    uint64 buffer_underruns = 1;       // Cumulative underrun count
    uint32 cpu_percent = 2;            // Audio thread CPU usage (0-100)
    uint32 latency_samples = 3;        // Current output latency
    uint64 plugin_blocks_missed = 4;   // 2.4c-1: bridge blocks bypassed (child late/dead)
    bool plugin_child_alive = 5;       // c-2: false during a death window / permanent bypass
    uint32 plugin_child_restarts = 6;  // c-2: cold restart attempts (budget 3)
    // Garde de projet (2026-08-27, « onglet vide mais l'export sonne ») :
    // le PROJET que ce moteur joue. L'onglet compare a son ?project= et
    // AFFICHE le desaccord (bandeau + refus d'export) au lieu de laisser
    // deux verites coexister. Additif : vide (vieux moteur / mode fichier)
    // = pas de garde.
    string project_id = 7;
}

// S8a: a batch of post-master audio blocks for the subscribed tab.
// first_seq counts 256-frame blocks since tap start; a seq gap = the
// control thread fell behind and the ring dropped (counted, visible).
// Samples are interleaved stereo float32, little-endian.
message AudioTap {
    uint64 first_seq = 1;
    uint32 block_count = 2;
    bytes samples = 3;         // block_count * 256 * 2 * 4 bytes
    uint64 dropped_blocks = 4; // cumulative ring overruns
}

// EXPORT MIXDOWN (AUDIT-6 quick win 1) : le client demande au moteur de
// rendre le document COURANT hors ligne (meme noyau que --render) et de
// publier le WAV au store d'assets. Le rendu tourne sur un thread ouvrier
// dedie - jamais la boucle de controle (lecon C1), jamais le thread audio.
message RenderRequest {
    uint32 bit_depth = 1;  // 16 | 24 | 32 ; 0 = defaut (24)
}

// Moteur -> Client : etat de l'export. STARTED a l'acceptation, puis DONE
// (wav_hash = sha256 du WAV, disponible sur /assets/<hash> du serveur) ou
// FAILED (error lisible). Un seul export a la fois : une demande pendant
// un rendu repond FAILED sans toucher au rendu en cours.
message RenderState {
    enum Status {
        STARTED = 0;
        DONE = 1;
        FAILED = 2;
    }
    Status status = 1;
    string wav_hash = 2;        // DONE : sha256 du WAV publie au store
    string error = 3;           // FAILED : la raison, lisible
    uint64 length_samples = 4;  // DONE : frames rendues
    uint32 sample_rate = 5;     // DONE : taux du rendu
    uint32 bit_depth = 6;       // DONE : profondeur du rendu
}

// 2.5-decouverte: one scanned plugin class (Audio Module Class only)
message PluginEntry {
    string uid = 1;             // 32-hex VST3 class id
    string name = 2;
    string vendor = 3;
    string sub_categories = 4;  // e.g. "Fx|Dynamics|Stereo", "Instrument|Synth"
}

// The engine's plugin catalog: scanned from --vst3-dir folders (cache
// by path+size+mtime, enumeration in the crash-isolated child), plus
// explicit --vst3-module mappings. Sent ONCE per connection, on auth.
message PluginCatalog {
    repeated PluginEntry entries = 1;
}

// Error from engine
message Error {
    enum Severity {
        WARNING = 0;
        ERROR = 1;
        FATAL = 2;
    }
    Severity severity = 1;
    string code = 2;                   // Machine-readable error code
    string message = 3;                // Human-readable message
}

// =============================================================================
// Wrapper Message (discriminated union)
// =============================================================================

message Message {
    oneof payload {
        // Client -> Engine
        TransportCommand transport = 1;
        SetMonitor set_monitor = 2;
        TapControl tap_control = 7;   // S8a
        EditorControl editor = 10;    // open/close a plugin GUI window
        SessionLaunch session_launch = 11;  // F5 : lancer/arreter un slot Session
        RenderRequest render_request = 13;  // export mixdown (AUDIT-6 QW1)

        // Engine -> Client
        TransportPosition position = 3;
        Meters meters = 4;
        EngineState engine_state = 5;
        Error error = 6;
        AudioTap audio_tap = 8;       // S8a
        PluginCatalog plugin_catalog = 9;  // 2.5-decouverte
        SessionState session_state = 12;   // F5+ : verite des slots Session
        RenderState render_state = 14;     // etat de l'export mixdown
    }
}
