<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAW</title>
    <style>
      /* ================================================================
         Design pass (2026-08-22): minimal, flat, dense — the Ableton
         lesson. One radius (3px), no decorative borders (hairlines and
         fill shades carry structure), a 4px spacing rhythm, tabular
         numerals, color reserved for STATE and CONTENT.
         ================================================================ */
      * {
        box-sizing: border-box;
      }
      :root {
        --bg: #131313;
        --surface: #1b1b1b;
        --surface-2: #212121;
        --surface-3: #282828;
        --hair: rgba(255, 255, 255, 0.05);
        --text: #cfcfcf;
        --text-2: #8f8f8f;
        --text-3: #5f5f5f;
        --amber: #d9a441;
        --green: #58b368;
        --blue: #4f8fd0;
        --orange: #cf8a3c;
        --red: #d05548;
        --r: 3px;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 12px;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 10px 14px 0;
        font-variant-numeric: tabular-nums;
        /* Viewport flex: tracks flex between transport and the Device
           View - no desert, no page scroll (the level-2 hole) */
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--surface-3);
        border: 0;
        border-radius: var(--r);
        cursor: pointer;
        padding: 5px 12px;
      }
      button:hover {
        background: #323232;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 1px solid var(--amber);
        outline-offset: 1px;
      }
      ::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ---- Control bar ---------------------------------------------- */
      .topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 10px;
      }
      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--text-2);
      }
      .transport {
        display: flex;
        gap: 2px;
      }
      .transport button {
        width: 34px;
        height: 26px;
        padding: 0;
        font-size: 11px;
        line-height: 26px;
      }
      .position {
        font-family: 'Cascadia Code', Consolas, monospace;
        font-size: 14px;
        letter-spacing: 1px;
        color: #b7d9a8;
        background: #0d0f0c;
        border-radius: var(--r);
        padding: 4px 14px 3px;
      }
      .status {
        display: flex;
        gap: 12px;
        margin-left: auto;
        font-size: 10px;
        text-transform: lowercase;
        letter-spacing: 0.5px;
        color: var(--text-3);
      }
      .status-item {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #3d3d3d;
      }
      .status-dot.connected {
        background: var(--green);
      }

      /* ---- Kit strip ------------------------------------------------ */
      .library {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 8px;
      }
      .library-label {
        font-size: 9px;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 1.2px;
        margin-right: 6px;
      }
      .sample-chip {
        padding: 3px 10px;
        font-size: 11px;
        border-radius: 10px;
        background: var(--surface-2);
        color: var(--text-2);
      }
      .sample-chip:hover {
        background: var(--surface-3);
        color: var(--text);
      }
      .sample-chip[aria-pressed='true'] {
        background: #23412f;
        color: #9fd9b4;
      }
      .library-hint {
        font-size: 10px;
        color: var(--text-3);
        margin-left: 8px;
      }
      body.sample-armed .track-lane {
        cursor: copy;
      }

      /* ---- Overview: the whole project, always visible -------------- */
      .overview {
        display: block;
        width: 100%;
        height: 36px;
        border-radius: var(--r);
        margin-bottom: 8px;
        cursor: pointer;
        touch-action: none;
      }

      /* ---- Timeline ------------------------------------------------- */
      .tracks {
        position: relative;
        overflow: auto;
        border-radius: var(--r);
        background: var(--surface);
        flex: 1;
        min-height: 0;
      }
      .ruler-row,
      .track {
        display: flex;
        align-items: stretch;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
      }
      .track-head,
      .ruler-spacer {
        flex: 0 0 260px;
        position: sticky;
        left: 0;
        z-index: 2;
        background: var(--surface-2);
        display: flex;
      }
      .track:hover .track-head {
        background: #252525;
      }
      .track-selected .track-head,
      .track-selected:hover .track-head {
        background: #2c2e31;
      }
      .track-selected .track-name {
        color: #fff;
      }
      .ruler-spacer {
        padding: 0 10px;
        font-size: 9px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--text-3);
        align-items: center;
      }
      .track-color {
        flex: 0 0 3px;
      }
      .track-head-body {
        flex: 1;
        padding: 7px 10px 6px;
        min-width: 0;
      }

      /* Split ruler */
      .ruler {
        position: relative;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
      }
      .ruler-cycle {
        height: 7px;
        background: #101010;
      }
      .ruler-seek {
        position: relative;
        height: 16px;
        cursor: pointer;
      }
      .ruler-seek:hover {
        background: rgba(255, 255, 255, 0.02);
      }
      .ruler-tick {
        position: absolute;
        top: 0;
        bottom: 0;
        border-left: 1px solid var(--hair);
        font-size: 9px;
        color: var(--text-3);
        padding-left: 3px;
        line-height: 16px;
        user-select: none;
        pointer-events: none;
      }

      .track-lane {
        position: relative;
        flex: 0 0 auto;
        background:
          repeating-linear-gradient(90deg,
            rgba(255, 255, 255, 0.028) 0, rgba(255, 255, 255, 0.028) 1px,
            transparent 1px, transparent 100px);
      }
      .clip {
        position: absolute;
        top: 2px;
        bottom: 2px;
        border-radius: var(--r);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .clip-name {
        flex: 0 0 13px;
        font-size: 9px;
        font-family: Consolas, monospace;
        color: rgba(255, 255, 255, 0.85);
        padding: 1px 5px 0;
        white-space: nowrap;
        overflow: hidden;
      }
      .clip-wave {
        flex: 1;
        width: 100%;
        min-height: 0;
      }
      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--amber);
        z-index: 3;
        pointer-events: none;
      }
      .playhead::before {
        content: '';
        position: absolute;
        top: 7px;
        left: -4px;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 6px solid var(--amber);
      }
      .insert-marker {
        position: absolute;
        top: 23px; /* below the ruler */
        bottom: 0;
        width: 1px;
        background: rgba(255, 255, 255, 0.35);
        z-index: 2;
        pointer-events: none;
      }
      .follow-btn[aria-pressed='true'] {
        background: #3c3524;
        color: var(--amber);
      }
      /* H: compact all tracks (fit height) */
      body.compact-tracks .track-head-body {
        padding: 3px 10px 2px;
      }
      body.compact-tracks .track-fader {
        margin-top: 1px;
      }
      body.compact-tracks .clip-name {
        flex-basis: 11px;
      }

      /* ---- Track head interior -------------------------------------- */
      .track-title-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .track-name {
        font-weight: 600;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }
      .track-gain {
        font-family: Consolas, monospace;
        font-size: 10px;
        color: var(--text-3);
        min-width: 46px;
        text-align: right;
        white-space: nowrap;
        flex: 0 0 auto;
      }
      .track-monitor {
        display: flex;
        gap: 2px;
      }
      .monitor-btn {
        width: 18px;
        height: 16px;
        padding: 0;
        font-size: 9px;
        font-weight: 700;
        line-height: 16px;
        border-radius: 2px;
        background: var(--surface-3);
        color: var(--text-2);
      }
      .monitor-mute[aria-pressed='true'] {
        background: var(--orange);
        color: #241605;
      }
      .monitor-solo[aria-pressed='true'] {
        background: var(--blue);
        color: #0a1a29;
      }
      .track-fader {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 6px;
      }
      /* Faders: a slim track and a RECTANGULAR thumb - a fader, not a
         web form control */
      input[type='range'] {
        -webkit-appearance: none;
        background: transparent;
        height: 16px;
        min-width: 40px;
        margin: 0;
      }
      input[type='range']::-webkit-slider-runnable-track {
        height: 3px;
        background: #3a3a3a;
        border-radius: 2px;
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 5px;
        height: 15px;
        margin-top: -6px;
        background: #b8b8b8;
        border-radius: 1px;
        cursor: ew-resize;
      }
      input[type='range']:hover::-webkit-slider-thumb {
        background: #e8e8e8;
      }
      .track-fader input {
        flex: 1;
      }
      .track-meter {
        width: 52px;
        height: 4px;
        background: #2a2a2a;
        border-radius: 2px;
        overflow: hidden;
      }
      .track-meter-fill {
        height: 100%;
        background: linear-gradient(90deg,
          var(--green) 0 70%, #d9c341 70% 90%, var(--red) 90%);
        width: 0%;
        transition: width 50ms;
      }

      .track-empty .track-head-body {
        padding: 3px 10px 2px;
      }
      .track-empty .track-name {
        font-size: 11px;
        font-weight: 400;
        color: var(--text-2);
      }
      .track-empty .track-fader {
        margin-top: 1px;
      }

      .addtrack {
        margin: 6px 0;
        align-self: flex-start;
        background: transparent;
        color: var(--text-2);
        font-size: 11px;
      }
      .addtrack:hover {
        background: var(--surface-2);
        color: var(--text);
      }

      /* ---- Device View ---------------------------------------------- */
      .device-view-slot {
        margin: 0 -14px; /* full-bleed inside the flex column */
        flex: 0 0 auto;
      }
      .device-view {
        background: #181818;
        box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.06);
        padding: 7px 14px 10px;
        min-height: 116px;
      }
      .device-view-title {
        font-size: 9px;
        color: var(--text-3);
        margin-bottom: 6px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      .device-chain {
        display: flex;
        gap: 8px;
        align-items: stretch;
        overflow-x: auto;
      }
      .device {
        background: var(--surface-2);
        border-radius: var(--r);
        min-width: 200px;
        display: flex;
        flex-direction: column;
      }
      .device-title {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 9px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
        font-size: 11px;
        font-weight: 600;
      }
      .device-toggle {
        width: 12px;
        height: 12px;
        padding: 0;
        border-radius: 50%;
        background: var(--amber);
      }
      .device-toggle:hover {
        background: #edbd5e;
      }
      .device-toggle[aria-pressed='true'] {
        background: #3b3b3b;
      }
      .device-toggle[aria-pressed='true']:hover {
        background: #4a4a4a;
      }
      .device-name {
        color: var(--text);
      }
      .device-body {
        padding: 8px 9px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .param-row {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 10px;
      }
      .param-label {
        min-width: 32px;
        color: var(--text-2);
        font-family: Consolas, monospace;
      }
      .param-row input {
        flex: 1;
      }
      .param-value {
        min-width: 32px;
        text-align: right;
        font-family: Consolas, monospace;
        color: var(--text-2);
      }
      .device-empty {
        color: var(--text-3);
        font-size: 11px;
        align-self: center;
        padding: 22px;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1>DAW</h1>
      <div class="transport">
        <button id="play-btn" disabled title="Play (Space)">&#9654;</button>
        <button id="stop-btn" disabled title="Stop (Space)">&#9632;</button>
        <button id="follow-btn" data-role="follow" class="follow-btn"
                title="Follow playhead">&#8677;</button>
      </div>
      <div class="position">
        <span id="position">00:00.000</span>
      </div>
      <div class="status">
        <div class="status-item">
          <div class="status-dot" id="server-status"></div>
          <span>server</span>
        </div>
        <div class="status-item">
          <div class="status-dot" id="engine-status"></div>
          <span>engine</span>
        </div>
      </div>
    </div>

    <div id="library-slot"></div>

    <div id="overview-slot"></div>

    <div class="tracks" id="tracks"></div>

    <button id="add-track-btn" class="addtrack">+ add track</button>

    <div class="device-view-slot" id="device-view-slot"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
