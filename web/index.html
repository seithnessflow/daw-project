<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magic Potion</title>
  </head>
  <body>
    <div class="topbar">
      <h1>MAGIC POTION</h1>
      <div class="transport">
        <button id="play-btn" disabled title="Play (Space)">&#9654;</button>
        <button id="stop-btn" disabled title="Stop (Space)">&#9632;</button>
        <button id="loop-btn" data-role="loop" class="follow-btn" disabled
                aria-pressed="false" title="Loop playback">&#8635;</button>
        <button id="follow-btn" data-role="follow" class="follow-btn"
                title="Follow playhead">&#8677;</button>
        <button id="help-btn" data-role="help" class="follow-btn help-btn"
                title="Raccourcis clavier (?)">?</button>
        <button id="sync-btn" data-role="sync" aria-pressed="false"
                title="Synchroniser le transport avec les pairs (Link L1b) : PLAY ici = PLAY la-bas">SYNC</button>
        <button id="jam-btn" data-role="jam" aria-pressed="false"
                title="Diffuser le jam aux pairs du projet (S8)">JAM</button>
        <button id="export-btn" data-role="export"
                title="Exporter le mixdown en WAV (rendu offline par le moteur)">WAV&#8595;</button>
      </div>
      <div class="para" role="tablist" aria-label="Vue">
        <button data-role="paradigm" data-view="arrangement" aria-pressed="true">Arrangement</button>
        <button data-role="paradigm" data-view="session" aria-pressed="false">Session</button>
        <button data-role="paradigm" data-view="mixage" aria-pressed="false">Mixage</button>
      </div>
      <div class="master-strip" id="master-strip" title="Master output">
        <span class="master-label">MASTER</span>
        <div class="master-vu" aria-hidden="true">
          <div class="master-vu-bar" id="master-vu-l"></div>
          <div class="master-vu-bar" id="master-vu-r"></div>
        </div>
        <input type="range" id="master-gain" data-role="master-gain"
               min="0" max="2" step="0.01" value="1" aria-label="Master gain">
        <span class="master-db" id="master-db">0.0 dB</span>
      </div>
      <div class="position">
        <span id="position">00:00.000</span>
      </div>
      <span id="life-status" aria-hidden="true"></span>
      <div class="touch-modes" title="prototypes de toucher (phase 3)">
        <button data-role="touch-mode" data-mode="a" aria-pressed="false"
                title="A - le poids">A</button>
        <button data-role="touch-mode" data-mode="b" aria-pressed="false"
                title="B - la pre-reponse">B</button>
        <button data-role="touch-mode" data-mode="c" aria-pressed="false"
                title="C - la couleur comme energie">C</button>
      </div>
      <div class="status">
        <div class="status-item" id="jam-status" data-state="idle">jam off</div>
        <div class="status-item">
          <div class="status-dot" id="server-status"></div>
          <span>server</span>
        </div>
        <div class="status-item">
          <div class="status-dot" id="engine-status"></div>
          <span>engine</span>
        </div>
      </div>
    </div>

    <!-- Refonte T5 : les slots gardent leurs id (le JS les remplit par id,
         jamais par position) - on ne fait que les RE-PARENTER.
         2026-08-26 (demande utilisateur « le rack est mieux en bas a la
         Ableton ») : le rack quitte la colonne de droite pour un PANNEAU DU
         BAS pleine largeur (Device View), frere de .workspace dans le body
         - la workspace n'a plus que 2 colonnes. -->
    <div class="workspace">
      <div class="col col-browser">
        <div id="browser-slot"></div>
      </div>
      <div class="col-split" data-split="browser" role="separator"
           aria-orientation="vertical" tabindex="0"
           title="Glisser pour redimensionner (double-clic : defaut)"></div>
      <div class="col col-arrange">
        <div id="starter-slot"></div>
        <div id="library-slot"></div>
        <div id="overview-slot"></div>
        <div class="tracks" id="tracks"></div>
        <button id="add-track-btn" class="addtrack">+ add track</button>
        <div id="session-slot"></div>
        <div id="mixer-slot"></div>
      </div>
    </div>
    <div class="col-split" data-split="device" role="separator"
         aria-orientation="horizontal" tabindex="0"
         title="Glisser pour redimensionner (double-clic : defaut)"></div>
    <div class="panel-device" data-rack-tab="rack">
      <div class="rack-tabs" role="tablist" aria-label="Panneau du bas">
        <button class="rack-tab" data-role="rack-tab" data-tab="rack"
                role="tab" aria-selected="true">Rack</button>
        <button class="rack-tab" data-role="rack-tab" data-tab="piano"
                role="tab" aria-selected="false">Piano-roll</button>
      </div>
      <div class="device-view-slot" id="device-view-slot"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
