<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAW</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1c1c1c;
        color: #d6d6d6;
        margin: 0;
        padding: 12px 16px 150px; /* bottom: room for the Device View */
      }

      /* ---- Control bar: identity, connections, transport, LCD ---- */
      .topbar {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .status {
        display: flex;
        gap: 14px;
        font-size: 12px;
        color: #9a9a9a;
      }
      .status-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4a4a4a;
      }
      .status-dot.connected {
        background: #4caf50;
      }
      .transport {
        display: flex;
        gap: 6px;
      }
      button {
        background: #2e2e2e;
        color: #d6d6d6;
        border: 1px solid #454545;
        padding: 7px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #3a3a3a;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      /* LCD: the inset dark display (Logic) */
      .position {
        font-family: monospace;
        font-size: 15px;
        color: #b7dcb7;
        background: #101210;
        border: 1px solid #2c2f2c;
        border-radius: 4px;
        padding: 5px 14px;
        margin-left: auto;
      }

      /* ---- Timeline area ---- */
      .tracks {
        position: relative;
        overflow-x: auto;
        border: 1px solid #2b2b2b;
        border-radius: 8px;
        background: #202020;
      }
      .ruler-row,
      .track {
        display: flex;
        align-items: stretch;
        border-bottom: 1px solid #292929;
      }
      .track-head,
      .ruler-spacer {
        flex: 0 0 260px;
        position: sticky;
        left: 0;
        z-index: 2;
        background: #262626;
        border-right: 1px solid #333;
        display: flex;
        padding: 0;
      }
      .ruler-spacer {
        padding: 4px 10px;
        font-size: 11px;
        color: #777;
        align-items: center;
      }
      /* Selected track: lighter head (Cubase/Logic) */
      .track-selected .track-head {
        background: #303336;
      }
      .track-color {
        flex: 0 0 4px;
      }
      .track-head-body {
        flex: 1;
        padding: 7px 10px;
        min-width: 0;
      }

      /* ---- Split ruler: cycle band (future) + seek band ---- */
      .ruler {
        position: relative;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
      }
      .ruler-cycle {
        height: 9px;
        background: #1b1b1b;
        border-bottom: 1px solid #2e2e2e;
      }
      .ruler-seek {
        position: relative;
        height: 18px;
        cursor: pointer; /* the ONLY click-to-seek surface */
      }
      .ruler-tick {
        position: absolute;
        top: 0;
        bottom: 0;
        border-left: 1px solid #3a3a3a;
        font-size: 10px;
        color: #777;
        padding-left: 3px;
        line-height: 18px;
        user-select: none;
        pointer-events: none;
      }

      .track-lane {
        position: relative;
        flex: 0 0 auto;
        background:
          repeating-linear-gradient(90deg, #262626 0, #262626 1px, transparent 1px, transparent 100px);
      }
      .clip {
        position: absolute;
        top: 3px;
        bottom: 3px;
        border: 1px solid;
        border-radius: 4px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .clip-name {
        flex: 0 0 14px;
        font-size: 10px;
        font-family: monospace;
        color: #e6eef6;
        padding: 1px 5px;
        white-space: nowrap;
        overflow: hidden;
      }
      .clip-wave {
        flex: 1;
        width: 100%;
        min-height: 0;
      }
      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #e8c15a;
        z-index: 3;
        pointer-events: none;
      }

      /* ---- Track head interior ---- */
      .track-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .track-name {
        font-weight: 500;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }
      .track-monitor {
        display: flex;
        gap: 3px;
      }
      .monitor-btn {
        padding: 1px 7px;
        font-size: 11px;
        line-height: 16px;
        border-radius: 3px;
        background: #2e2e2e;
        border-color: #454545;
      }
      /* color = state: mute orange, solo blue */
      .monitor-mute[aria-pressed='true'] {
        background: #8a5a1e;
        border-color: #c98a34;
        color: #ffe0b0;
      }
      .monitor-solo[aria-pressed='true'] {
        background: #1f4f7a;
        border-color: #3e83c0;
        color: #cfe6ff;
      }
      .track-fader {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }
      .track-fader input {
        flex: 1;
        height: 5px;
        -webkit-appearance: none;
        background: #424242;
        border-radius: 3px;
        outline: none;
        min-width: 40px;
      }
      .track-fader input::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px;
        height: 13px;
        background: #7d7d7d;
        border-radius: 50%;
        cursor: pointer;
      }
      .track-fader input::-webkit-slider-thumb:hover {
        background: #9d9d9d;
      }
      .track-gain {
        font-family: monospace;
        font-size: 11px;
        color: #9f9f9f;
        min-width: 58px;
        text-align: right;
        white-space: nowrap;
      }
      .track-meter {
        width: 56px;
        height: 6px;
        background: #303030;
        border-radius: 3px;
        overflow: hidden;
      }
      .track-meter-fill {
        height: 100%;
        background: linear-gradient(90deg, #4caf50 0 70%, #ffeb3b 70% 90%, #f44336 90%);
        width: 0%;
        transition: width 50ms;
      }

      /* Empty track: compact strip (graceful degradation) */
      .track-empty .track-head-body {
        padding: 3px 10px;
      }
      .track-empty .track-name {
        font-size: 12px;
        color: #8d8d8d;
      }
      .track-empty .track-fader {
        margin-top: 2px;
      }

      .addtrack {
        margin-top: 10px;
      }

      /* ---- Device View: the selected track's chain (bottom band) ---- */
      .device-view-slot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
      }
      .device-view {
        background: #232323;
        border-top: 1px solid #383838;
        padding: 8px 16px 10px;
        min-height: 118px;
      }
      .device-view-title {
        font-size: 11px;
        color: #8f8f8f;
        margin-bottom: 6px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }
      .device-chain {
        display: flex;
        gap: 10px;
        align-items: stretch;
        overflow-x: auto;
      }
      .device {
        background: #2b2b2b;
        border: 1px solid #3d3d3d;
        border-radius: 6px;
        min-width: 190px;
        display: flex;
        flex-direction: column;
      }
      .device-title {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 9px;
        border-bottom: 1px solid #383838;
        font-size: 12px;
      }
      /* Ableton's round activator: LIT when active, dark when bypassed */
      .device-toggle {
        width: 14px;
        height: 14px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid #6b5a1f;
        background: #e0b13c; /* active */
        cursor: pointer;
      }
      .device-toggle[aria-pressed='true'] {
        background: #3a3a3a; /* bypassed = unlit */
        border-color: #4a4a4a;
      }
      .device-name {
        color: #cfcfcf;
      }
      .device-body {
        padding: 7px 9px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .param-row {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
      }
      .param-label {
        min-width: 34px;
        color: #9a9a9a;
        font-family: monospace;
      }
      .param-row input {
        flex: 1;
        height: 4px;
        -webkit-appearance: none;
        background: #454545;
        border-radius: 2px;
        outline: none;
      }
      .param-row input::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 11px;
        height: 11px;
        background: #8b8b8b;
        border-radius: 50%;
        cursor: pointer;
      }
      .param-value {
        min-width: 34px;
        text-align: right;
        font-family: monospace;
        color: #b5b5b5;
      }
      .device-empty {
        color: #6e6e6e;
        font-size: 12px;
        align-self: center;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1>DAW</h1>
      <div class="status">
        <div class="status-item">
          <div class="status-dot" id="server-status"></div>
          <span>Server</span>
        </div>
        <div class="status-item">
          <div class="status-dot" id="engine-status"></div>
          <span>Engine</span>
        </div>
      </div>
      <div class="transport">
        <button id="play-btn" disabled>Play</button>
        <button id="stop-btn" disabled>Stop</button>
      </div>
      <div class="position">
        <span id="position">00:00.000</span>
      </div>
    </div>

    <div class="tracks" id="tracks"></div>

    <button id="add-track-btn" class="addtrack">+ Add Track</button>

    <div class="device-view-slot" id="device-view-slot"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
