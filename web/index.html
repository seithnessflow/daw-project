<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAW - Slice 1</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        margin: 0;
        padding: 20px;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 24px;
        font-weight: 500;
      }
      .status {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        font-size: 14px;
      }
      .status-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #555;
      }
      .status-dot.connected {
        background: #4caf50;
      }
      .status-dot.error {
        background: #f44336;
      }
      .transport {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      button {
        background: #333;
        color: #e0e0e0;
        border: 1px solid #555;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #444;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .tracks {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .track {
        background: #252525;
        padding: 15px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .track-name {
        width: 150px;
        font-weight: 500;
      }
      .track-fader {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .track-fader input {
        flex: 1;
        height: 6px;
        -webkit-appearance: none;
        background: #444;
        border-radius: 3px;
        outline: none;
      }
      .track-fader input::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: #666;
        border-radius: 50%;
        cursor: pointer;
      }
      .track-fader input::-webkit-slider-thumb:hover {
        background: #888;
      }
      .track-gain {
        width: 50px;
        text-align: right;
        font-family: monospace;
        font-size: 12px;
      }
      .track-meter {
        width: 100px;
        height: 10px;
        background: #333;
        border-radius: 5px;
        overflow: hidden;
      }
      .track-meter-fill {
        height: 100%;
        background: linear-gradient(90deg, #4caf50, #ffeb3b, #f44336);
        width: 0%;
        transition: width 50ms;
      }
      .position {
        font-family: monospace;
        font-size: 18px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <h1>DAW - Slice 1</h1>

    <div class="status">
      <div class="status-item">
        <div class="status-dot" id="server-status"></div>
        <span>Server</span>
      </div>
      <div class="status-item">
        <div class="status-dot" id="engine-status"></div>
        <span>Engine</span>
      </div>
    </div>

    <div class="position">
      <span id="position">00:00.000</span>
    </div>

    <div class="transport">
      <button id="play-btn" disabled>Play</button>
      <button id="stop-btn" disabled>Stop</button>
    </div>

    <div class="tracks" id="tracks"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
